<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#1F3D57" />
<title>HQ · Scheidung-Online</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="hq.css?v=4" />
<script src="hq.js?v=4" defer></script>
</head>
<body>

<!-- Boot: sichtbar, bis die Sitzung geprüft ist -->
<div id="boot" class="boot" role="status" aria-live="polite">
  <img src="assets/logo-scheidung-online.png" alt="Scheidung-Online" class="boot-logo" />
  <div class="spinner" aria-hidden="true"></div>
  <p id="boot-text">HQ wird geladen …</p>
  <button type="button" class="btn btn-zweit" id="boot-retry" hidden>Erneut versuchen</button>
</div>

<!-- B1 Anmeldung -->
<section id="login" class="login" hidden>
  <form id="login-form" class="login-card" novalidate>
    <img src="assets/logo-scheidung-online.png" alt="Scheidung-Online" class="login-logo" />
    <h1 id="login-titel">Anmelden</h1>
    <p class="muted" id="login-text">Interner Bereich der Kanzlei Janine D. Wagner. Zugang nur für berechtigte Personen.</p>
    <div id="login-schritt1">
      <label for="login-name">E-Mail oder Benutzername</label>
      <input id="login-name" name="name" autocomplete="username" autocapitalize="none" spellcheck="false" />
      <label for="login-pw">Passwort</label>
      <div class="pw-wrap">
        <input id="login-pw" name="passwort" type="password" autocomplete="current-password" />
        <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Passwort anzeigen" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div id="login-schritt3" hidden>
      <label for="einl-pw1">Neues Passwort (mindestens 10 Zeichen)</label>
      <input id="einl-pw1" type="password" autocomplete="new-password" minlength="10" />
      <label for="einl-pw2">Passwort wiederholen</label>
      <input id="einl-pw2" type="password" autocomplete="new-password" minlength="10" />
    </div>
    <p id="login-ok" class="ok-text" role="status" hidden></p>
    <div id="login-schritt2" hidden>
      <label for="login-code">Sechsstelliger Code</label>
      <input id="login-code" class="code-feld" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000 000" />
    </div>
    <p id="login-err" class="fehler-text" role="alert" hidden></p>
    <button type="submit" class="btn btn-primaer btn-voll" id="login-btn">Weiter</button>
    <p class="muted small center" id="login-zurueck" hidden><button type="button" class="link" id="login-neu">Anderes Konto verwenden</button></p>
  </form>
</section>

<!-- App -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <a class="marke" href="#/posteingang"><img src="assets/logo-scheidung-online.png" alt="Scheidung-Online" /><span class="hq-badge">HQ</span></a>
    <nav class="module" aria-label="Module">
      <a href="#/posteingang" data-modul="posteingang">Posteingang<span class="zahl" id="nav-neu" hidden></span></a>
      <a href="#/akten" data-modul="akten">Akten</a>
      <a href="#/vorlagen" data-modul="vorlagen">Vorlagen</a>
      <a href="#/einstellungen" data-modul="einstellungen">Einstellungen</a>
    </nav>
    <div class="topbar-rechts"><span id="user-name"></span><button type="button" class="btn btn-ghost btn-klein" id="logout">Abmelden</button></div>
  </header>
  <div id="banner" class="banner" role="alert" hidden><span id="banner-text"></span><button type="button" class="btn btn-zweit btn-klein" id="banner-retry">Erneut versuchen</button></div>
  <main id="main" class="main" tabindex="-1"></main>
</div>

<!-- Modal -->
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titel" hidden>
  <div class="modal-box">
    <div class="modal-kopf">
      <div><h2 id="modal-titel"></h2><p class="muted small" id="modal-sub"></p></div>
      <button type="button" class="modal-x" id="modal-x" aria-label="Schließen">×</button>
    </div>
    <div id="modal-inhalt"></div>
    <div class="modal-fuss"><button type="button" class="btn btn-zweit" id="modal-abbrechen">Abbrechen</button><button type="button" class="btn btn-primaer" id="modal-ok">Senden</button></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast" role="status" aria-live="polite"><span class="toast-icon" aria-hidden="true"></span><span id="toast-text"></span><button type="button" class="toast-btn" id="toast-btn" hidden></button></div>

<noscript><p class="center">Bitte JavaScript aktivieren.</p></noscript>
</body>
</html>
